name: legal pages

on:
  pull_request:

permissions:
  contents: read

jobs:
  rebuild:
    name: rebuild, diff, and text checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned markdown
        run: python -m pip install -r requirements.txt
      - name: Fresh build must match committed HTML
        run: python scripts/build-legal.py --check
